spring.application.name=geobill
spring.datasource.url=jdbc:mysql://localhost:3306/geobill?unicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
security.ignored=/**
server.port=8082
spring.datasource.password=325339
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode= always
jwt.expiration=86400000
logging.file.path=D:\MYLOG
spring.messages.basename=messages/messages
app.locale=en_US
##LICENSE CONFIGURATION
geolicense.server-url=https://geolicense.my.id
# diperoleh dari https://geolicense.my.id
geolicense.license-key=GEOLIC-73865DE7-C13EA8F1
geolicense.product-sku=BILL
geolicense.verify-interval-ms=3600000
geolicense.grace-period-minutes=30
# lokasi machine-id + token aktivasi; hapus folder ini = mesin dianggap baru = seat terpakai lagi
geolicense.state-dir=${user.home}/.geolicense
